services:
  - type: web
    name: sih2026-backend
    env: node
    region: singapore  # Closest to India
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false   # Set this manually in Render dashboard
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: SMTP_HOST
        value: sandbox.smtp.mailtrap.io
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Internal SIH 2026 <noreply@sih2026.vsitr.ac.in>"
      - key: ADMIN_EMAIL
        value: admin@sih2026.vsitr.ac.in
      - key: SEED_ADMIN_NAME
        value: Super Admin
      - key: SEED_ADMIN_EMAIL
        value: admin@sih2026.ac.in
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: REGISTRATION_DEADLINE
        value: "2026-08-02T18:29:00.000Z"
      # Set these after deploying frontend and admin to Vercel:
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: VERCEL_FRONTEND_URL
        sync: false
      - key: VERCEL_ADMIN_URL
        sync: false
